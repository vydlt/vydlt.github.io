short_bio: >-
  <p>
    Hi, Vy here! Navigating my twenties, learning the ropes of life, and enjoying everyday work in the industry. I love connecting and growing with like-minded people.
  </p>
  <p>
    I am working in FMCG production. Previously, I also worked in Semiconductors and Retail Solutions spaces. While my career is rooted in Operations and Supply Chain, my interests stretch across disciplines. I enjoy exploring any domains that challenge me to learn, contribute, and grow. 
  </p>
  <p>
    Here are a few main areas that I have been working on:
    <ul>
      <li>Lean Production: Workload Analysis, Process Improvement, People Structure Improvement</li>
      <li>Manufacturing Digital Transformation: Digital Reporting, Digital Supporting Systems</li>
      <li>People Capability & Programs: Training Programs, People Engagement Programs</li>
    </ul>
  </p>
  <p>
    I often follow AI and technology news to stay current. Outside of work, I enjoy reading from time to time and spend a lot of time doing physical therapy.
  </p>
  <p>
    I am currently employed, but if you have any opportunities — feel free to reach out, I would love to connect and discuss.
  </p>

