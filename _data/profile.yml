short_bio: >-
  <p>
    <b>ABOUT ME</b>
  </p>
  <p>
    Hi, I’m Vy — a twenty-something figuring out the ropes of life, finding joy in everyday work, and learning what it means to live well. I love connecting with like-minded people and growing together.
    <a href="mailto:{{ site.data.profile.email | encode_email }}">
    <i class="fas fa-envelope"></i>
    <span>Say hi!</span>
    </a>  
  </p>

  <p>
    I am working in FMCG production. Previously, I also worked in Semiconductors and Retail Solutions spaces. My career is rooted in Operations & Supply Chain, but my curiosity extends across disciplines. I enjoy exploring different domains that challenge me to learn, contribute, and grow. 
  </p>

  <p>
    Here are a few main areas that I have been working on:
    <ul>
      <li>Lean Production</li>
      <li>Manufacturing Digital Transformation</li>
      <li>People Capability & People Programs</li>
    </ul>
  </p>

  <p>
    Outside of work, I like reading from time to time and, unfortunately, spend quite a bit of time on physical therapy.
  </p>

  <p>
    I am currently employed, but if you have any opportunities — feel free to reach out, I would love to discuss.
  </p>
  

