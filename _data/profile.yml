short_bio: >-
  <p>
    Hi, Vy here! Navigating my twenties, learning the ropes of life, and enjoying everyday work in the industry. I love connecting and growing with like-minded people.
  </p>
  <p>
    I am currently in <i>FMCG</i> production. Previously, I also handled operations and supply chain, but for the <i>Semiconductors</i> and <i>Retail Solutions</i> spaces. Here are a few main areas that I have been working on:
    <ul>
      <li>Lean Production: Workload Analysis, Process Improvement, People Structure Improvement</li>
      <li>Manufacturing Digital Transformation: Digital Reporting, Digital Supporting Systems</li>
      <li>People Capability & Programs: Training Skills, Production Engagement Programs</li>
    </ul>
  </p>
  <p>
    In my free time, I like to catch up on AI and technology news. I am into music and literature, and spend a lot of time doing physical therapy too 
  </p>

