<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title> -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>

<body class="bg-light d-flex flex-column min-vh-100" {{ page.body_attr }}>
<!-- 
    {% include navbar.html active_page="Home" %} -->

    <main class="flex-grow-1">
        <div class="container py-5">

            <div class="bg-white rounded-xl p-4"
                 style="border: 1px solid #f0f0f0;">

                <h1 class="mb-4">{{ page.title }}</h1>

                <div class="course-list">

                    {% for course in site.courses %}
                        <a href="{{ course.url | relative_url }}"
                           class="course-item d-block py-3 px-3">
                            {{ course.title }}
                        </a>
                    {% endfor %}

                </div>

            </div>

        </div>
    </main>

    {% include footer.html %}

</body>
</html>
